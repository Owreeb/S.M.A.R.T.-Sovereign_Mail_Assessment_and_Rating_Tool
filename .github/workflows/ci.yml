name: CI

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - scanner/**
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - scanner/**

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sonar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --coverage
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=owreeb
            -Dsonar.projectKey=Owreeb_SMART
            -Dsonar.sources=frontend/src
            -Dsonar.exclusions=frontend/src/__tests__/**
            -Dsonar.test.inclusions=frontend/src/__tests__/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.coverage.exclusions=frontend/src/components/**,frontend/src/models/**,frontend/src/*.ts,frontend/src/*.tsx

  sonar-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --dev
        working-directory: scanner
      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=xml
        working-directory: scanner
        continue-on-error: true
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=owreeb
            -Dsonar.projectKey=Owreeb_SMART
            -Dsonar.sources=scanner/src
            -Dsonar.python.coverage.reportPaths=coverage.xml