# IMAP / POP3 server signatures. Matched against the IMAP banner and host.
# vendor_country_rating must equal VendorCountryRating.from_country_code(vendor_country)
# and vendor_category_rating must equal VendorCategory(vendor_category).rating
# (validated by parse_signature.py).

# --- Open-source mail servers ---
- regex: "(?i)dovecot"
  software: Dovecot
  vendor: Open-Xchange / Dovecot
  vendor_country: FI
  vendor_category: Community / Public Sector / Gemeinwohl
  role: imap_pop3
  open_source_rating: 1
  vendor_country_rating: 2
  vendor_category_rating: 1

- regex: "(?i)cyrus"
  software: Cyrus IMAP
  vendor: Cyrus / Fastmail
  vendor_country: US
  vendor_category: Community / Public Sector / Gemeinwohl
